name = "ota-email-worker"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Dispatch targets. Both are public webhook URLs.
[vars]
OTA_WEBHOOK_URL = "https://vayves.com/api/webhooks/ota-email"
INBOUND_WEBHOOK_URL = "https://amaldives.com/api/inbound/cloudflare"

# Secrets (NOT vars) — set each with `wrangler secret put <NAME>`:
#   OTA_INGEST_SECRET       must equal the stay project's OTA_INGEST_SECRET
#   INBOUND_WEBHOOK_SECRET  must equal the amaldives project's INBOUND_WEBHOOK_SECRET
