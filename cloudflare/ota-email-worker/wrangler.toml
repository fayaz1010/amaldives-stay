name = "ota-email-worker"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# The stay.amaldives.com webhook this worker forwards parsed emails to.
[vars]
WEBHOOK_URL = "https://stay.amaldives.com/api/webhooks/ota-email"

# OTA_INGEST_SECRET is a SECRET, not a var. Set it (must equal the value in the
# Vercel project's OTA_INGEST_SECRET env) with:
#   wrangler secret put OTA_INGEST_SECRET
